[tool.poetry]
name = "vast-pipeline"
version = "2.0.0dev"
description = "Vast Pipeline code base for processing and analysing telescope images from the Square Kilometre Pathfinder"
authors = ["The VAST Development Team"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11.0,<4"
astropy = "^7.0"
astroquery = "==0.4.7"
bokeh = "3.6.1" # must align with @bokeh/bokehjs version in package.json
channels = "^3.0.4"
cloudpickle = "^3.1"
colorcet = "^2.0.6"
datashader = "^0.16"
dask = {extras = ["complete"], version = "^2024.12.1"}
dask-expr = "^1.1"
dill = "^0"
distributed = "^2024.12.1"
Django = "^3.2.18"
django-crispy-forms = "^1.9.2"
django-environ = "^0.4.5"
django-postgres-copy = "^2.7.6"
django-q = "^1.3.3"
django-tagulous = "^1.1.0"
djangorestframework = "^3.11.0"
djangorestframework-datatables = "0.5.1"
forced-phot = { git = "https://github.com/askap-vast/forced_phot.git", tag = "v0.2.0" }
gevent = { version = "^24", optional = true }
gunicorn = { version = "^20.0.4", optional = true }
holoviews = "^1.14.7"
Jinja2 = "^3.0.3"
llvmlite = "^0.43"
matplotlib = "^3.5.0"
networkx = "^2.4"
numba = "^0.60"
numpy = "^2.0"
pandas = "^2.0.3"
psutil = "^5.7.0"
psycopg2 = "^2.9.10"
pyarrow = "^18.0"
scipy = "^1.6.0"
social-auth-app-django = "^3.1.0"
social-auth-core = "^3.3.3"
sqlalchemy = "^2.0.17"
strictyaml = "^1.3.2"
whitenoise = "^5.2.0"

[tool.poetry.group.dev.dependencies]
mkdocs-material = "^9.4"
mkdocstrings = {extras = ["python"], version = "^0.25.0"}
mkdocs-minify-plugin = "^0"
mkdocs-material-extensions = "^1.0.1"
mkdocs-gen-files = "^0"
pygraphviz = "^1.7"
ipdb = "^0.13.6"
ipython = "^8.10.0"
pip-tools = "^5.5.0"
tabulate = "^0.8.9"
django-debug-toolbar = "^3.2"
flake8 = "^3.9.0"
mypy = "^0.910"
black = "^20.8b1"
django-extensions = "^3.1.1"
rope = "^0.18.0"
django-stubs = "^1.9.0"
lightgallery = "^0"
mkdocs-git-revision-date-localized-plugin = "^0"
mike = "^1.1.2"
markdown = "3.3.7"

[tool.poetry.extras]
prod = ["gevent", "gunicorn"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "webinterface.settings"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
